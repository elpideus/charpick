# Publishes a release when a v* tag is pushed (scripts/release.sh pushes one): the checks from
# ci.yml, then the Windows installer and the Linux download, each built on its own system, then a
# GitHub release carrying them and their SHA-256 sums. A tag with a "-" (v1.1.0-beta.1) is
# published as a pre-release.
#
# The downloads keep the same names from release to release (Charpick-Setup.exe,
# charpick-linux-x86_64.tar.gz), so the README's links to releases/latest/download/... always
# give the latest stable release.
#
# Run by hand (Actions, Release, Run workflow), it builds them from the chosen ref and keeps them
# as workflow artifacts, publishing nothing: builds to test.
#
# Every action is pinned to a commit, with its tag in a comment: a tag can be moved to other code,
# a commit cannot.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, and never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is published only once CI's checks pass on it. A build by hand skips them: it publishes
  # nothing, and whoever starts it wants the downloads soon.
  checks:
    name: Checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The stable branch installs the latest stable Rust.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache saved on a tag serves only that tag. A test build on main saves one the next
          # tag starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The tag matches the version in the repository
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/version.sh --check "$GITHUB_REF_NAME"

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      # installer/build.ps1 compiles the installer with Inno Setup. Chocolatey installs it when
      # the runner image has none, and leaves it as it is otherwise.
      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      # The command the README gives for building on Windows.
      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1

      - name: Print the checksum
        run: sha256sum dist/Charpick-Setup.exe | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charpick-${{ steps.version.outputs.version }}-windows
          path: dist/Charpick-Setup.exe
          if-no-files-found: error
          # Running the jobs again replaces the artifact instead of failing on it.
          overwrite: true

  # Built on the oldest Ubuntu the runners offer, so the program asks for no newer glibc than
  # 2.35 and runs on every distribution with Plasma 6.
  linux:
    name: Build for Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The tag matches the version in the repository
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/version.sh --check "$GITHUB_REF_NAME"

      - name: Version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sh installer/build-linux.sh

      - name: Print the checksum
        run: sha256sum dist/charpick-linux-x86_64.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charpick-${{ steps.version.outputs.version }}-linux
          path: dist/charpick-linux-x86_64.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    needs: [checks, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
    steps:
      # The whole history and every tag: the notes list the commits since the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Both builds' downloads, in one folder.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: charpick-${{ needs.linux.outputs.version }}-*
          merge-multiple: true
          path: assets

      - name: Release notes
        run: scripts/release-notes.sh "$TAG" > release-notes.md

      - name: Checksums
        run: |
          cd assets
          sha256sum Charpick-Setup.exe charpick-linux-x86_64.tar.gz > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      - name: Publish
        run: |
          files=(assets/Charpick-Setup.exe assets/charpick-linux-x86_64.tar.gz assets/SHA256SUMS)
          # A pre-release is never marked as the latest release.
          if [[ "$TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: replace the files and the notes instead of failing.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "Charpick $VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Charpick $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi
